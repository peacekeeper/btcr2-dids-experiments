uniregistrar:
  drivers:
    - method: btcr2
      url: http://driver-did-btcr2.uni-registrar:9080/
      propertiesEndpoint: 'true'
      traits:
        updatable: true
        deactivatable: true
        enumerable: true
        historyAvailable: true
        humanReadable: false
  tweakDidDocument:
    btcr2:
      removeEmptyVerificationMethods: true
      removeEmptyVerificationRelationships: true
      removeEmptyServices: true
  tweakOptions:
    btcr2:
      addResolvedDidDocument: didSourceDocument
      addResolvedDidDocumentMetadata: nextVersionId:targetVersionId
  convertDidDocumentOperations:
    btcr2:
      convertToPatchDidDocument: true
